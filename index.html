<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2EE Secure Private Chat</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Universal QR Generator & Scanner Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: #1e293b; padding: 1.5rem; border-radius: 16px; width: 90%; max-width: 420px; text-align: center; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .modal-box h2 { margin-bottom: 0.25rem; color: #38bdf8; }
    .modal-box p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.75rem; }
    
    .room-display-container { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
    .my-room-box { background: #0f172a; padding: 0.6rem 1rem; border-radius: 8px; border: 1px dashed #38bdf8; font-size: 1.2rem; font-weight: bold; letter-spacing: 3px; color: #38bdf8; user-select: all; cursor: pointer; width: 100%; }
    
    #qrcode { background: white; padding: 8px; border-radius: 8px; display: inline-block; margin-top: 0.25rem; }
    
    .modal-box input { width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 0.75rem; outline: none; font-size: 1rem; text-align: center; }
    .modal-box button { width: 100%; padding: 0.75rem; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .modal-box button:hover { background: #0369a1; }
    
    .scan-btn { background: #334155 !important; margin-bottom: 0.75rem; }
    .scan-btn:hover { background: #475569 !important; }

    .divider { margin: 0.75rem 0; border-top: 1px solid #334155; position: relative; }
    .divider span { position: relative; top: -10px; background: #1e293b; padding: 0 10px; font-size: 0.75rem; color: #64748b; }

    /* Scanner Modal Window */
    #scannerModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; padding: 1rem; }
    #reader { width: 100%; max-width: 320px; border-radius: 12px; overflow: hidden; border: 2px solid #38bdf8; background: #000; }
    .close-scanner-btn { margin-top: 1rem; background: #ef4444; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .chat-container { width: 100%; max-width: 650px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; border-left: 1px solid #334155; border-right: 1px solid #334155; }
    .chat-header { padding: 1rem; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .room-title { display: flex; flex-direction: column; }
    .e2e-tag { color: #22c55e; font-size: 0.75rem; margin-top: 2px; }
    .room-badge { background: #0369a1; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

    .messages-area { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
    .message { max-width: 80%; padding: 0.65rem 0.9rem; border-radius: 12px; font-size: 0.95rem; word-break: break-word; position: relative; }
    .message.mine { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
    .message.others { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
    .sender-name { font-size: 0.75rem; font-weight: bold; margin-bottom: 0.25rem; color: #7dd3fc; }
    .time-stamp { font-size: 0.65rem; text-align: right; opacity: 0.7; margin-top: 0.3rem; }
    
    .chat-media { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 0.5rem; display: block; object-fit: cover; cursor: pointer; }
    
    .file-attachment { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.75rem; border-radius: 8px; margin-top: 0.5rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-width: 220px; }
    .file-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
    .file-name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 0.7rem; opacity: 0.7; margin-top: 2px; }
    .download-btn { background: #22c55e; color: white; padding: 0.4rem 0.8rem; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: bold; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }

    .upload-progress-wrapper { display: flex; align-items: center; gap: 8px; background: rgba(15, 23, 42, 0.6); padding: 4px 8px; border-radius: 20px; }
    .progress-spinner { width: 22px; height: 22px; border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .progress-text { font-size: 0.75rem; font-weight: 700; color: #38bdf8; min-width: 32px; text-align: center; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 2rem; }
    #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
    .lightbox-download { position: absolute; top: 20px; right: 20px; background: #22c55e; color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-weight: bold; }

    .chat-input-container { padding: 0.75rem 1rem; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 0.5rem; align-items: center; }
    .chat-input-container input[type="text"] { flex: 1; padding: 0.75rem 1rem; border-radius: 24px; border: 1px solid #475569; background: #1e293b; color: white; outline: none; font-size: 0.95rem; }
    .icon-btn { cursor: pointer; padding: 0.6rem; background: #334155; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; user-select: none; }
    .send-btn { padding: 0.6rem 1.2rem; border: none; background: #22c55e; color: white; font-weight: bold; border-radius: 24px; cursor: pointer; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div id="modal">
    <div class="modal-box">
      <h2>Private Room Chat</h2>
      <p>Scan QR code with phone camera or copy PIN:</p>
      
      <div class="room-display-container">
        <div class="my-room-box" id="myRoomDisplay" onclick="copyRoomCode()">------</div>
        <div id="qrcode"></div>
      </div>
      
      <input type="text" id="usernameInput" placeholder="Your Display Name" maxlength="20">
      
      <div class="divider"><span>OR JOIN A ROOM</span></div>
      
      <button class="scan-btn" onclick="startQRScanner()">📷 Scan Friend's QR Code</button>
      <input type="text" id="targetRoomInput" placeholder="Enter 6-Digit Room PIN" style="text-transform: uppercase;" maxlength="6">
      <button onclick="connectToChat()">Open / Join Chat</button>
    </div>
  </div>

  <div id="scannerModal">
    <h3 style="color:#38bdf8; margin-bottom: 0.5rem;">Align QR Code in Frame</h3>
    <div id="reader"></div>
    <button class="close-scanner-btn" onclick="stopQRScanner()">Cancel</button>
  </div>

  <div id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <a id="lightboxDownload" class="lightbox-download" download="shared-photo.jpg">📥 Download</a>
    <img id="lightboxImg" src="" alt="Full Screen View">
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="room-title">
        <h3 id="chatHeaderTitle">Chat Room</h3>
        <span class="e2e-tag">🔒 End-to-End Encrypted (Chunk Streaming)</span>
      </div>
      <span class="room-badge" id="roomBadge">Status: Disconnected</span>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="chat-input-container">
      <label class="icon-btn" title="Send Any File Size">
        📎
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileUpload(event)">
      </label>
      <input type="text" id="messageInput" placeholder="Type a secure message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function generateShortPin() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let result = '';
      const bytes = new Uint8Array(6);
      crypto.getRandomValues(bytes);
      for (let i = 0; i < 6; i++) {
        result += chars[bytes[i] % chars.length];
      }
      return result;
    }

    function generateSecureId(prefix = '') {
      const array = new Uint8Array(8);
      crypto.getRandomValues(array);
      return prefix + Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    const myClientId = generateSecureId('client_');
    const myRoomId = generateShortPin();
    document.getElementById('myRoomDisplay').textContent = myRoomId;

    const currentBaseUrl = window.location.href.split('?')[0];
    const roomShareUrl = `${currentBaseUrl}?room=${myRoomId}`;

    new QRCode(document.getElementById("qrcode"), { text: roomShareUrl, width: 110, height: 110 });

    const urlParams = new URLSearchParams(window.location.search);
    const urlRoomPin = urlParams.get('room');
    if (urlRoomPin) {
      document.getElementById('targetRoomInput').value = urlRoomPin.toUpperCase();
    }

    let username = 'Anonymous';
    let activeRoomId = myRoomId;
    let cryptoKey = null;
    let mqttClient = null;
    let localChatHistory = [];
    let hasLoadedHistory = false;
    let html5QrcodeScanner = null;

    const incomingChunks = {}; 
    const KDF_SALT = new TextEncoder().encode("E2EE_STATIC_SALT_V1");

    function copyRoomCode() {
      navigator.clipboard.writeText(myRoomId);
      alert(`Copied Room PIN: ${myRoomId}\nOr share URL: ${roomShareUrl}`);
    }

    async function initCryptoKey(passphrase) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: KDF_SALT, iterations: 100000, hash: 'SHA-256' },
        keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
      );
    }

    async function encryptPayload(dataObj) {
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const jsonStr = JSON.stringify(dataObj);
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, enc.encode(jsonStr));
      return JSON.stringify({ iv: Array.from(iv), data: Array.from(new Uint8Array(encrypted)) });
    }

    async function decryptPayload(payloadStr) {
      try {
        const payload = JSON.parse(payloadStr);
        const iv = new Uint8Array(payload.iv);
        const data = new Uint8Array(payload.data);
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, data);
        return JSON.parse(new TextDecoder().decode(decrypted));
      } catch (e) {
        return null;
      }
    }

    async function connectToChat() {
      const nameInput = document.getElementById('usernameInput').value.trim();
      const targetInput = document.getElementById('targetRoomInput').value.trim().toUpperCase();

      if (!nameInput) return alert('Please enter your display name!');
      username = nameInput;

      activeRoomId = targetInput || myRoomId;
      cryptoKey = await initCryptoKey(activeRoomId);

      document.getElementById('modal').style.display = 'none';
      document.getElementById('roomBadge').textContent = 'Connecting...';
      document.getElementById('chatHeaderTitle').textContent = `Room: ${activeRoomId}`;

      mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
        keepalive: 60,
        reconnectPeriod: 2000,
        connectTimeout: 30000
      });

      mqttClient.on('connect', () => {
        document.getElementById('roomBadge').textContent = 'Connected';
        mqttClient.subscribe(`e2ee-hostchat-v8/${activeRoomId}`);

        setTimeout(async () => {
          if (!hasLoadedHistory) {
            await broadcastPayload({ type: 'history_request', requesterId: myClientId });
          }
        }, 1000);
      });

      mqttClient.on('message', async (t, message) => {
        const decrypted = await decryptPayload(message.toString());
        if (!decrypted) return;
        handleIncomingMessage(decrypted);
      });
    }

    async function startQRScanner() {
      document.getElementById('scannerModal').style.display = 'flex';
      html5QrcodeScanner = new Html5Qrcode("reader");

      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      try {
        await html5QrcodeScanner.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            let detectedPin = decodedText;
            if (decodedText.includes('?room=')) {
              detectedPin = new URL(decodedText).searchParams.get('room');
            }
            document.getElementById('targetRoomInput').value = detectedPin.toUpperCase();
            stopQRScanner();
          },
          (errorMessage) => {}
        );
      } catch (err) {
        alert("Camera permission denied or camera unavailable.");
        stopQRScanner();
      }
    }

    async function stopQRScanner() {
      if (html5QrcodeScanner) {
        try {
          await html5QrcodeScanner.stop();
          html5QrcodeScanner.clear();
        } catch (e) {}
      }
      document.getElementById('scannerModal').style.display = 'none';
    }

    async function handleIncomingMessage(msg) {
      const now = Date.now();

      if (msg.type === 'history_request' && msg.requesterId !== myClientId && localChatHistory.length > 0) {
        await broadcastPayload({ type: 'history_response', targetId: msg.requesterId, history: localChatHistory });
        return;
      }

      if (msg.type === 'history_response' && msg.targetId === myClientId && !hasLoadedHistory) {
        hasLoadedHistory = true;
        localChatHistory = msg.history.filter(m => !m.expiresAt || now <= m.expiresAt);
        document.getElementById('messagesArea').innerHTML = '';
        localChatHistory.forEach(item => renderMessage(item, false));
        return;
      }

      if (msg.type === 'file_chunk') {
        const { msgId, chunkIndex, totalChunks, chunkData } = msg;

        if (msg.senderId !== myClientId) {
          if (!incomingChunks[msgId]) {
            incomingChunks[msgId] = { chunks: [], total: totalChunks, meta: msg };
            renderUploadPlaceholder(msgId, msg.fileName, msg.fileSize, msg.time, msg.sender, false);
          }

          incomingChunks[msgId].chunks[chunkIndex] = chunkData;
          const receivedCount = incomingChunks[msgId].chunks.filter(Boolean).length;
          const percent = Math.round((receivedCount / totalChunks) * 100);
          updateProgressUI(msgId, percent);

          if (receivedCount === totalChunks) {
            const completeBase64 = incomingChunks[msgId].chunks.join('');
            const assembledMsg = {
              ...incomingChunks[msgId].meta,
              type: msg.fileTypeCategory,
              content: completeBase64
            };
            delete incomingChunks[msgId];

            const tempElem = document.getElementById(msgId);
            if (tempElem) tempElem.remove();

            localChatHistory.push(assembledMsg);
            renderMessage(assembledMsg, true);
          }
        }
        return;
      }

      if (msg.expiresAt && now > msg.expiresAt) return;

      if (msg.type !== 'history_request' && msg.type !== 'history_response') {
        const existingTemp = document.getElementById(msg.msgId);
        if (existingTemp) existingTemp.remove();

        localChatHistory.push(msg);
        if (localChatHistory.length > 100) localChatHistory.shift();
        renderMessage(msg, true);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const now = Date.now();
      const payload = {
        msgId: generateSecureId('msg_'),
        sender: username,
        senderId: myClientId,
        type: 'text',
        content: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        timestamp: now,
        expiresAt: now + (24 * 60 * 60 * 1000)
      };

      input.value = '';
      await broadcastPayload(payload);
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const tempMsgId = generateSecureId('msg_');
      const now = Date.now();
      const formattedTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const formattedSize = formatBytes(file.size);

      renderUploadPlaceholder(tempMsgId, file.name, formattedSize, formattedTime, username, true);

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const base64Data = e.target.result;
          const CHUNK_SIZE = 32 * 1024;
          const totalChunks = Math.ceil(base64Data.length / CHUNK_SIZE);

          let fileTypeCategory = 'file';
          if (file.type.startsWith('image/')) fileTypeCategory = 'image';
          else if (file.type.startsWith('video/')) fileTypeCategory = 'video';

          for (let i = 0; i < totalChunks; i++) {
            const chunkData = base64Data.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
            const chunkPayload = {
              type: 'file_chunk',
              msgId: tempMsgId,
              sender: username,
              senderId: myClientId,
              fileName: file.name,
              fileSize: formattedSize,
              fileTypeCategory: fileTypeCategory,
              chunkIndex: i,
              totalChunks: totalChunks,
              chunkData: chunkData,
              time: formattedTime,
              timestamp: now,
              expiresAt: now + (24 * 60 * 60 * 1000)
            };

            await broadcastPayload(chunkPayload);

            const percent = Math.round(((i + 1) / totalChunks) * 100);
            updateProgressUI(tempMsgId, percent);
            await new Promise(r => setTimeout(r, 25));
          }

          const fullMsg = {
            msgId: tempMsgId,
            sender: username,
            senderId: myClientId,
            type: fileTypeCategory,
            content: base64Data,
            fileName: file.name,
            fileSize: formattedSize,
            time: formattedTime,
            timestamp: now,
            expiresAt: now + (24 * 60 * 60 * 1000)
          };

          const tempElem = document.getElementById(tempMsgId);
          if (tempElem) tempElem.remove();

          localChatHistory.push(fullMsg);
          renderMessage(fullMsg, true);

        } catch (err) {
          alert("Failed to stream file.");
          const elem = document.getElementById(tempMsgId);
          if (elem) elem.remove();
        } finally {
          event.target.value = '';
        }
      };

      reader.readAsDataURL(file);
    }

    function renderUploadPlaceholder(id, fileName, fileSize, time, sender, isMine) {
      const container = document.getElementById('messagesArea');
      const msgDiv = document.createElement('div');
      msgDiv.id = id;
      msgDiv.className = `message ${isMine ? 'mine' : 'others'}`;

      msgDiv.innerHTML = `
        <div class="sender-name">${escapeHtml(sender)}</div>
        <div class="file-attachment">
          <div class="file-info">
            <span class="file-name">📄 ${escapeHtml(fileName)}</span>
            <span class="file-size">${fileSize}</span>
          </div>
          <div class="upload-progress-wrapper">
            <div class="progress-spinner"></div>
            <span class="progress-text" id="progress_text_${id}">0%</span>
          </div>
        </div>
        <div class="time-stamp">${time}</div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function updateProgressUI(id, percent) {
      const progressText = document.getElementById(`progress_text_${id}`);
      if (progressText) progressText.textContent = `${percent}%`;
    }

    async function broadcastPayload(payload) {
      if (!mqttClient || !cryptoKey) return;
      const encrypted = await encryptPayload(payload);
      mqttClient.publish(`e2ee-hostchat-v8/${activeRoomId}`, encrypted, { qos: 0 });
    }

    function renderMessage(msg, shouldScroll = true) {
      const container = document.getElementById('messagesArea');
      const msgDiv = document.createElement('div');
      if (msg.msgId) msgDiv.id = msg.msgId;
      
      const isMine = msg.senderId === myClientId;
      msgDiv.className = `message ${isMine ? 'mine' : 'others'}`;

      let contentHtml = '';
      if (msg.type === 'text') {
        contentHtml = `<div>${escapeHtml(msg.content)}</div>`;
      } else if (msg.type === 'image') {
        contentHtml = `<img src="${msg.content}" class="chat-media" alt="Photo" onclick="openLightbox('${msg.content}')"/>`;
      } else if (msg.type === 'video') {
        contentHtml = `<video src="${msg.content}" controls class="chat-media"></video>`;
      } else if (msg.type === 'file') {
        contentHtml = `
          <div class="file-attachment">
            <div class="file-info">
              <span class="file-name">📄 ${escapeHtml(msg.fileName || 'File')}</span>
              <span class="file-size">${msg.fileSize || ''}</span>
            </div>
            <a href="${msg.content}" download="${escapeHtml(msg.fileName || 'download')}" class="download-btn">📥 Download</a>
          </div>`;
      }

      msgDiv.innerHTML = `
        <div class="sender-name">${escapeHtml(msg.sender)}</div>
        ${contentHtml}
        <div class="time-stamp">${msg.time}</div>
      `;

      container.appendChild(msgDiv);
      if (shouldScroll) container.scrollTop = container.scrollHeight;
    }

    function openLightbox(imgSrc) {
      document.getElementById('lightboxImg').src = imgSrc;
      document.getElementById('lightboxDownload').href = imgSrc;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
