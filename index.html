<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2EE Host & Join Private Chat</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    
    /* Setup Modal */
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: #1e293b; padding: 2rem; border-radius: 16px; width: 90%; max-width: 420px; text-align: center; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .modal-box h2 { margin-bottom: 0.5rem; color: #38bdf8; }
    .modal-box p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; }
    .modal-box input { width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 1rem; outline: none; font-size: 1rem; text-align: center; }
    .my-room-box { background: #0f172a; padding: 0.75rem; border-radius: 8px; border: 1px dashed #475569; margin-bottom: 1.25rem; font-size: 0.9rem; color: #38bdf8; word-break: break-all; }
    .modal-box button { width: 100%; padding: 0.75rem; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
    .modal-box button:hover { background: #0369a1; }
    .divider { margin: 1rem 0; border-top: 1px solid #334155; position: relative; }
    .divider span { position: relative; top: -10px; background: #1e293b; padding: 0 10px; font-size: 0.75rem; color: #64748b; }

    /* Chat App Interface */
    .chat-container { width: 100%; max-width: 650px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; border-left: 1px solid #334155; border-right: 1px solid #334155; }
    
    /* Header */
    .chat-header { padding: 1rem; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .room-title { display: flex; flex-direction: column; }
    .e2e-tag { color: #22c55e; font-size: 0.75rem; margin-top: 2px; }
    .room-badge { background: #0369a1; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

    /* Messages Stream */
    .messages-area { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
    .message { max-width: 80%; padding: 0.65rem 0.9rem; border-radius: 12px; font-size: 0.95rem; word-break: break-word; }
    .message.mine { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
    .message.others { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
    .sender-name { font-size: 0.75rem; font-weight: bold; margin-bottom: 0.25rem; color: #7dd3fc; }
    .time-stamp { font-size: 0.65rem; text-align: right; opacity: 0.7; margin-top: 0.3rem; }
    
    .system-msg { align-self: center; background: #0f172a; color: #94a3b8; font-size: 0.75rem; padding: 0.3rem 0.8rem; border-radius: 12px; border: 1px solid #334155; margin: 0.2rem 0; }
    
    /* Media elements */
    .chat-media { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 0.5rem; display: block; object-fit: cover; cursor: pointer; transition: opacity 0.2s; }
    .chat-media:hover { opacity: 0.9; }

    /* File Attachment Box */
    .file-attachment { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.75rem; border-radius: 8px; margin-top: 0.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .file-info { display: flex; flex-direction: column; overflow: hidden; }
    .file-name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 0.7rem; opacity: 0.7; }
    .download-btn { background: #22c55e; color: white; padding: 0.4rem 0.8rem; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: bold; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s; }
    .download-btn:hover { background: #16a34a; }

    /* Fullscreen Image Lightbox Modal */
    #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 2rem; }
    #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lightbox-download { position: absolute; top: 20px; right: 20px; background: #22c55e; color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 6px; }

    /* Footer / Input Bar */
    .chat-input-container { padding: 0.75rem 1rem; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 0.5rem; align-items: center; }
    .chat-input-container input[type="text"] { flex: 1; padding: 0.75rem 1rem; border-radius: 24px; border: 1px solid #475569; background: #1e293b; color: white; outline: none; font-size: 0.95rem; }
    .icon-btn { cursor: pointer; padding: 0.6rem; background: #334155; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; user-select: none; transition: background 0.2s; }
    .icon-btn:hover { background: #475569; }
    .send-btn { padding: 0.6rem 1.2rem; border: none; background: #22c55e; color: white; font-weight: bold; border-radius: 24px; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
    .send-btn:hover { background: #16a34a; }
  </style>
</head>
<body>

  <!-- Connection Setup Modal -->
  <div id="modal">
    <div class="modal-box">
      <h2>Private Room Chat</h2>
      <p>Your Device's Room ID:</p>
      <div class="my-room-box" id="myRoomDisplay">Generating Room ID...</div>
      
      <input type="text" id="usernameInput" placeholder="Your Display Name (e.g. Alex)" maxlength="20">
      
      <div class="divider"><span>OR JOIN SOMEONE ELSE</span></div>
      
      <input type="text" id="targetRoomInput" placeholder="Paste Friend's Room ID Here">
      <button onclick="connectToChat()">Open / Join Chat</button>
    </div>
  </div>

  <!-- Fullscreen Lightbox for Photos -->
  <div id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <a id="lightboxDownload" class="lightbox-download" download="shared-photo.jpg">📥 Download</a>
    <img id="lightboxImg" src="" alt="Full Screen View">
  </div>

  <!-- Chat UI -->
  <div class="chat-container">
    <div class="chat-header">
      <div class="room-title">
        <h3 id="chatHeaderTitle">Chat Room</h3>
        <span class="e2e-tag">🔒 End-to-End Encrypted (AES-GCM)</span>
      </div>
      <span class="room-badge" id="roomBadge">Status: Ready</span>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="chat-input-container">
      <label class="icon-btn" title="Send Any File, Photo or Video">
        📎
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileUpload(event)">
      </label>
      <input type="text" id="messageInput" placeholder="Type a secure message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // Each device generates its own unique host room ID upon opening link
    const myRoomId = 'room_' + Math.random().toString(36).substring(2, 9);
    document.getElementById('myRoomDisplay').textContent = myRoomId;

    let username = 'Anonymous';
    let activeRoomId = myRoomId; // Defaults to hosting own room
    let cryptoKey = null;
    let mqttClient = null;

    // Derive AES-256-GCM encryption key based entirely on the target room ID
    async function initCryptoKey(roomId) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.digest('SHA-256', enc.encode(roomId));
      return crypto.subtle.importKey('raw', keyMaterial, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }

    async function encryptPayload(dataObj) {
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const jsonStr = JSON.stringify(dataObj);
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, enc.encode(jsonStr));
      
      return JSON.stringify({
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
      });
    }

    async function decryptPayload(payloadStr) {
      try {
        const payload = JSON.parse(payloadStr);
        const iv = new Uint8Array(payload.iv);
        const data = new Uint8Array(payload.data);
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, data);
        return JSON.parse(new TextDecoder().decode(decrypted));
      } catch (e) {
        return null; // Ignore mismatched packets
      }
    }

    async function connectToChat() {
      const nameInput = document.getElementById('usernameInput').value.trim();
      const targetInput = document.getElementById('targetRoomInput').value.trim();

      if (!nameInput) return alert('Please enter your display name!');
      username = nameInput;

      // If user typed someone else's room ID, switch to that room. Otherwise host own room.
      if (targetInput) {
        activeRoomId = targetInput;
      } else {
        activeRoomId = myRoomId;
      }

      cryptoKey = await initCryptoKey(activeRoomId);

      document.getElementById('modal').style.display = 'none';
      document.getElementById('roomBadge').textContent = targetInput ? 'Connected to: ' + targetInput : 'Hosting Room: ' + myRoomId;
      document.getElementById('chatHeaderTitle').textContent = targetInput ? 'Chat (Joined Room)' : 'Chat (My Room)';

      // Connect to MQTT Broker
      mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
        keepalive: 30,
        reconnectPeriod: 2000
      });

      mqttClient.on('connect', async () => {
        const topic = `e2ee-hostchat-v3/${activeRoomId}`;
        mqttClient.subscribe(topic);

        const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        await broadcastPayload({
          sender: username,
          type: 'presence',
          action: 'join',
          time: nowTime
        });
      });

      mqttClient.on('message', async (t, message) => {
        const decrypted = await decryptPayload(message.toString());
        if (!decrypted) return;
        renderMessage(decrypted, true);
      });
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const payload = {
        sender: username,
        type: 'text',
        content: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      input.value = '';
      await broadcastPayload(payload);
    }

    // Handles ANY file type upload with zero size limitation via Base64 conversion
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Data = e.target.result;
        const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let fileTypeCategory = 'file';
        if (file.type.startsWith('image/')) fileTypeCategory = 'image';
        else if (file.type.startsWith('video/')) fileTypeCategory = 'video';

        const payload = {
          sender: username,
          type: fileTypeCategory,
          content: base64Data,
          fileName: file.name,
          fileSize: formatBytes(file.size),
          time: nowTime
        };

        await broadcastPayload(payload);
      };

      reader.readAsDataURL(file);
      event.target.value = '';
    }

    async function broadcastPayload(payload) {
      const encrypted = await encryptPayload(payload);
      const topic = `e2ee-hostchat-v3/${activeRoomId}`;
      mqttClient.publish(topic, encrypted);
    }

    function renderMessage(msg, shouldScroll = true) {
      const container = document.getElementById('messagesArea');

      if (msg.type === 'presence') {
        const sysDiv = document.createElement('div');
        sysDiv.className = 'system-msg';
        sysDiv.textContent = `🟢 ${msg.sender} joined the room at ${msg.time}`;
        container.appendChild(sysDiv);
        if (shouldScroll) container.scrollTop = container.scrollHeight;
        return;
      }

      const msgDiv = document.createElement('div');
      const isMine = msg.sender === username;
      msgDiv.className = `message ${isMine ? 'mine' : 'others'}`;

      let contentHtml = '';
      if (msg.type === 'text') {
        contentHtml = `<div>${escapeHtml(msg.content)}</div>`;
      } else if (msg.type === 'image') {
        contentHtml = `<img src="${msg.content}" class="chat-media" alt="Photo" onclick="openLightbox('${msg.content}')"/>`;
      } else if (msg.type === 'video') {
        contentHtml = `
          <video src="${msg.content}" controls class="chat-media"></video>
          <div style="margin-top:5px;"><a href="${msg.content}" download="${msg.fileName || 'video.mp4'}" class="download-btn">📥 Download Video</a></div>
        `;
      } else if (msg.type === 'file') {
        contentHtml = `
          <div class="file-attachment">
            <div class="file-info">
              <span class="file-name">📄 ${escapeHtml(msg.fileName || 'Document')}</span>
              <span class="file-size">${msg.fileSize || ''}</span>
            </div>
            <a href="${msg.content}" download="${msg.fileName || 'download'}" class="download-btn">📥 Download</a>
          </div>
        `;
      }

      msgDiv.innerHTML = `
        <div class="sender-name">${escapeHtml(msg.sender)}</div>
        ${contentHtml}
        <div class="time-stamp">${msg.time}</div>
      `;

      container.appendChild(msgDiv);
      if (shouldScroll) container.scrollTop = container.scrollHeight;
    }

    // Lightbox Controls for Fullscreen Images
    function openLightbox(imgSrc) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxDownload = document.getElementById('lightboxDownload');
      
      lightboxImg.src = imgSrc;
      lightboxDownload.href = imgSrc;
      lightbox.style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
